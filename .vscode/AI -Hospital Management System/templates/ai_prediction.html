<!DOCTYPE html>
<html>

<head>

    <title>AI Disease Prediction</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f6f9;
            margin: 0;
        }

        header {
            background-color: #1976d2;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        textarea {
            width: 90%;
            height: 120px;
            padding: 15px;
            font-size: 16px;
        }

        button {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background-color: #e8f5e9;
            border-radius: 8px;
        }

        a {
            color: #1976d2;
        }

    </style>

</head>

<body>

<header>

    <h1>🤖 AI Disease Prediction</h1>

</header>

<div class="container">

    <a href="/">← Back to Dashboard</a>

    <div class="box">

        <h2>Enter Patient Symptoms</h2>

        <form method="POST">

            <textarea
                name="symptoms"
                placeholder="Example: fever, cough, headache"
                required
            ></textarea>

            <br><br>

            <button type="submit">
                🔍 Predict
            </button>

        </form>


        {% if prediction %}

        <div class="result">

            <h2>Prediction Result</h2>

            <p>{{ prediction }}</p>

            <p>
                <small>
                    ⚠️ This is a project demonstration and
                    not a medical diagnosis.
                </small>
            </p>

        </div>

        {% endif %}

    </div>

</div>

</body>

</html>
