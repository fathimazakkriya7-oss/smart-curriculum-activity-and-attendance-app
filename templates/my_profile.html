<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        .header {
            background: #4f46e5;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .profile-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .profile-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #4f46e5;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin: 0 auto 20px;
        }

        .profile-card h2 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 30px;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .info-box {
            background: #f8f9ff;
            padding: 18px;
            border-radius: 10px;
        }

        .info-box strong {
            display: block;
            color: #666;
            margin-bottom: 7px;
        }

        .info-box span {
            font-size: 18px;
            font-weight: bold;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 12px 22px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back:hover {
            background: #3730a3;
        }

        @media (max-width: 600px) {

            .info {
                grid-template-columns: 1fr;
            }

            .container {
                width: 95%;
            }

        }

    </style>

</head>

<body>

    <div class="header">

        <h1>👤 My Profile</h1>

    </div>


    <div class="container">

        <div class="profile-card">

            <div class="profile-icon">
                👨‍🎓
            </div>

            <h2>
                {{ student['name'] }}
            </h2>


            <div class="info">

                <div class="info-box">

                    <strong>
                        Student Name
                    </strong>

                    <span>
                        {{ student['name'] }}
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        Register Number
                    </strong>

                    <span>
                        {{ student['reg_no'] }}
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        Class
                    </strong>

                    <span>
                        {{ student['student_class'] }}
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        Department
                    </strong>

                    <span>
                        {{ student['department'] }}
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        Year
                    </strong>

                    <span>
                        {{ student['year'] }}
                    </span>

                </div>

            </div>


            <a href="/my_dashboard" class="back">
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
