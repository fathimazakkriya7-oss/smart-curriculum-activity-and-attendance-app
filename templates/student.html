<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f4f8;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        form {
            background: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            padding: 8px 15px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
        }

        table {
            margin: auto;
            margin-top: 30px;
            border-collapse: collapse;
            width: 80%;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
        }

        th {
            background: #007bff;
            color: white;
        }

        a {
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
            color: white;
        }

        .edit {
            background: orange;
        }

        .delete {
            background: red;
        }

        .nav a {
            margin: 10px;
            text-decoration: none;
            padding: 8px 12px;
            background: #007bff;
            color: white;
            border-radius: 5px;
        }

        .nav a:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<h1>Student Management</h1>

<div class="nav">
    <a href="/dashboard">Dashboard</a>
    <a href="/attendance">Attendance</a>
    <a href="/report">Report</a>
</div>

<form method="POST">
    <input type="text" name="name" placeholder="Student Name" required><br>
    <input type="text" name="reg_no" placeholder="Register No" required><br>
    <input type="text" name="student_class" placeholder="Class" required><br>
    <button type="submit">Add Student</button>
</form>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Register No</th>
        <th>Class</th>
        <th>Action</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{ student[0] }}</td>
        <td>{{ student[1] }}</td>
        <td>{{ student[2] }}</td>
        <td>{{ student[3] }}</td>
        <td>
            <a class="edit" href="/edit/{{ student[0] }}">Edit</a>
            <a class="delete" href="/delete/{{ student[0] }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
