<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f4f8;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background: white;
            padding: 20px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            margin-top: 10px;
        }

        .nav {
            margin-top: 20px;
        }

        .nav a {
            margin: 10px;
            text-decoration: none;
            padding: 8px 12px;
            background: #007bff;
            color: white;
            border-radius: 5px;
        }

        .nav a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<h1>Attendance Dashboard</h1>

<div class="nav">
    <a href="/student">Students</a>
    <a href="/attendance">Attendance</a>
    <a href="/report">Report</a>
</div>

<div class="container">

    <div class="card">
        <h3>Total Students</h3>
        <div class="number">{{ total_students }}</div>
    </div>

    <div class="card">
        <h3>Present</h3>
        <div class="number">{{ present }}</div>
    </div>

    <div class="card">
        <h3>Absent</h3>
        <div class="number">{{ absent }}</div>
    </div>

</div>

</body>
</html>
